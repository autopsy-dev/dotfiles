# Separate password-only image. No host FILES or keyfiles are imported.
# Use the UEFI simpledrm framebuffer; load GPU drivers after root unlock.
MODULES=(usbhid xhci_hcd)
BINARIES=()
FILES=()
HOOKS=(base systemd autodetect microcode modconf block keyboard sd-vconsole plymouth sd-encrypt filesystems fsck graphical-unlock)
COMPRESSION="zstd"

